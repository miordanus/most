name: Deploy to Amvera

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Amvera
        env:
          AMVERA_USERNAME: ${{ secrets.AMVERA_USERNAME }}
          AMVERA_PASSWORD: ${{ secrets.AMVERA_PASSWORD }}
        run: |
          cat > /tmp/git-askpass.sh << 'EOF'
          #!/bin/sh
          case "$1" in
            Username*) echo "$AMVERA_USERNAME" ;;
            Password*) echo "$AMVERA_PASSWORD" ;;
          esac
          EOF
          chmod +x /tmp/git-askpass.sh
          export GIT_ASKPASS=/tmp/git-askpass.sh
          git remote add amvera https://git.msk0.amvera.ru/miordanus/most
          git push amvera HEAD:main --force
