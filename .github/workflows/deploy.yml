name: Deploy to Amvera

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Amvera
        run: |
          git remote add amvera https://${{ secrets.AMVERA_USERNAME }}:${{ secrets.AMVERA_PASSWORD }}@git.msk0.amvera.ru/miordanus/most
          git push amvera HEAD:main --force
